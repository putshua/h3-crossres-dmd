[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3dmd"
version = "0.1.0"
description = "MiniMax-H3-native DMD training and inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "torch>=2.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "attrs>=23",
  "loguru>=0.7",
  "termcolor>=2",
  "nvidia-ml-py>=12",
  "iopath>=0.1.10",
  "fvcore>=0.1.5",
  "cloudpickle>=2",
  "einops>=0.8",
  "tqdm>=4.66",
  "pillow>=10",
  "imageio>=2.34",
  "psutil>=5",
]

[project.optional-dependencies]
h3 = [
  "accelerate>=1.10",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@refs/pull/14355/head",
  "peft>=0.18",
  "transformers>=5.0",
]
train = ["tensorboard>=2.17"]
media = ["torchvision>=0.22", "av>=14", "opencv-python-headless>=4.8"]
test = ["pytest>=8.0"]

[project.scripts]
h3dmd-train = "h3dmd.cli.train:main"
h3dmd-infer = "h3dmd.cli.infer:main"
h3dmd-cache = "h3dmd.cli.cache:main"
h3dmd-validate = "h3dmd.cli.validate:main"

[tool.setuptools.packages.find]
include = ["h3dmd*", "imaginaire*", "rcm*", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
